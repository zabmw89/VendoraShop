# Local production-like stack for VendoraShop.
#
#   docker compose up --build
#
# Brings up PostgreSQL and the single-image app (Django API + compiled React SPA
# served by Gunicorn/WhiteNoise). Visit http://localhost:8000 once it's up.
#
# On first boot, seed the demo catalog + credentials:
#   docker compose exec app python manage.py seed_demo_data
# (DEMO_MODE=true is already set below.)

services:
  db:
    container_name: vendorashop-db
    image: postgres:16
    environment:
      POSTGRES_USER: vendora
      POSTGRES_PASSWORD: vendora
      POSTGRES_DB: vendorashop
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendora"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    container_name: vendorashop-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: production
      DEBUG: "False"
      # Override SECRET_KEY with a real 32+ char secret for anything public.
      SECRET_KEY: "change-me-to-a-secure-random-32-char-secret-value"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      DATABASE_URL: "postgres://vendora:vendora@db:5432/vendorashop"
      # Seed demo data via `docker compose exec app python manage.py seed_demo_data`
      DEMO_MODE: "true"
      # Optional Stripe keys for real payments:
      # STRIPE_SECRET_KEY: "sk_test_xxx"
      STRIPE_PUBLISHABLE_KEY: "pk_test_xxx"
      STRIPE_WEBHOOK_SECRET: "whsec_xxx"
    ports:
      - "8000:8000"

volumes:
  pgdata:
